# hyprlock config (v0.9.x)
# Docs: https://github.com/hyprwm/hyprlock/tree/main

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = rgba(17, 17, 27, 1.0)
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    outer_color = rgba(137, 180, 250, 1.0)
    inner_color = rgba(30, 30, 46, 1.0)
    font_color = rgba(205, 214, 244, 1.0)
    placeholder_text = <i>Password...</i>
    fade_on_empty = true
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    position = 0, -100
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = $foreground
    font_size = 14
    position = 0, -150
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 5
    shadow_boost = 0.5
}

# USER
label {
    monitor =
    text = cmd[update:1000] echo "$USER"
    color = $foreground
    font_size = 14
    position = 0, -50
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 5
    shadow_boost = 0.5
}

image {
  path = ~/profile/user.jpeg
  size = 200
  position = 0, 75
  halign = center
  valign = center
  border_size = 3
  border_color = $color1
  shadow_passes = 1
  shadow_size = 5
  shadow_boost = 0.5
}
